# 数据源配置（Spring Boot 3.x + Druid）
spring:
    main:
        allow-bean-definition-overriding: true
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        druid:
            master:
                url: jdbc:mysql://127.0.0.1:3306/su_crm?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&connectTimeout=60000&socketTimeout=60000&allowPublicKeyRetrieval=true
                username: root
                password: 123456
                driver-class-name: com.mysql.cj.jdbc.Driver
            slave:
                enabled: false
                url:
                username:
                password:
                driver-class-name: com.mysql.cj.jdbc.Driver
            initial-size: 5
            min-idle: 10
            max-active: 20
            max-wait: 60000
            connect-timeout: 30000
            socket-timeout: 60000
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
            max-evictable-idle-time-millis: 900000
            validation-query: SELECT 1
            test-while-idle: true
            test-on-borrow: false
            test-on-return: false
            filter:
                stat:
                    enabled: true
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true
