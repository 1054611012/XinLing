worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        root   D:\nw;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # 主入口：统一判断 userAgent（修复：用 $http_user_agent 读取 HTTP 头）
        location /appversioninfo/gd/history {
            # 鸿蒙 → 跳转到精准匹配
            if ( $http_user_agent ~* "harmony|hongmeng" ){
                rewrite ^ /appversioninfo/gd/history/harmony break;
            }
            # iOS
            if ( $http_user_agent ~* "ios|iphone|ipad" ){
                rewrite ^ /appversioninfo/gd/history/ios break;
            }
            # Android（默认）
            if ( $http_user_agent ~* "android" ){
                rewrite ^ /appversioninfo/gd/history/android break;
            }

            # 跨域
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Credentials' 'true';
            default_type application/json;
        }

        # 鸿蒙专用（带缓存禁用）
        location = /appversioninfo/gd/history/harmony {
            add_header Cache-Control no-cache;
            add_header Pragma no-cache;
            add_header Expires 0;
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Credentials' 'true';
            default_type application/json;
            alias D:/nginx/html/harmonyOS.json;
        }

        # iOS 专用（修复：从 harmonyOS.json 改为 ios.json）
        location = /appversioninfo/gd/history/ios {
            add_header Cache-Control no-cache;
            add_header 'Access-Control-Allow-Origin' '*';
            default_type application/json;
            alias D:/nginx/html/ios.json;
        }

        # Android 专用（修复：从 harmonyOS.json 改为 android.json）
        location = /appversioninfo/gd/history/android {
            add_header Cache-Control no-cache;
            add_header 'Access-Control-Allow-Origin' '*';
            default_type application/json;
            alias D:/nginx/html/android.json;
        }

        access_log  logs/files.access.log;
        error_log   logs/files.error.log;
    }
}
